name: Mirror releases
on:
  push:
    tags: ["v*"]

jobs:
  mirror:
    runs-on: android_build
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version
        run: |
          set -eu
          VERSION="${FORGEJO_REF_NAME#v}"
          export VERSION
          python3 -c 'import json,os; assert json.load(open("custom_components/rustyhama/manifest.json"))["version"] == os.environ["VERSION"]'
      - name: Mirror commit and tag to GitHub
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -eu
          test -n "$GH_MIRROR_TOKEN"
          git remote add github "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/narolinus/RustyHAMA-integration.git"
          git fetch github main
          if git merge-base --is-ancestor "${FORGEJO_SHA}" refs/remotes/github/main; then
            echo "GitHub main already contains the tagged commit."
          elif git merge-base --is-ancestor refs/remotes/github/main "${FORGEJO_SHA}"; then
            git push github "${FORGEJO_SHA}:refs/heads/main"
          else
            echo "Forgejo and GitHub main have diverged; refusing to overwrite either history." >&2
            exit 1
          fi
          git push github "refs/tags/${GITHUB_REF_NAME}"
