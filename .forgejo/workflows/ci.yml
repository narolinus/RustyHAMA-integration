name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container: python:3.14
    steps:
      - name: Checkout and install toolchain
        run: |
          apt-get update
          apt-get install -y git nodejs npm
          git init
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          pip install -e '.[test]'
      - run: ruff check .
      - run: mypy custom_components/rustyhama
      - run: pytest
      - run: node --test tests/frontend.test.mjs
      - run: python scripts/check_docs.py
      - run: zensical build --clean --strict
      - run: zensical build --config-file zensical.en.toml --clean --strict
      - run: zensical build --config-file zensical.fr.toml --clean --strict

  validate-hacs:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Docker client for validator actions
        run: |
          apt-get update
          apt-get install -y docker.io
      - name: Hassfest
        run: |
          VALIDATOR_ID="$(docker create ghcr.io/home-assistant/hassfest:latest)"
          trap 'docker rm -f "$VALIDATOR_ID" >/dev/null 2>&1 || true' EXIT
          docker cp . "$VALIDATOR_ID:/github/workspace"
          docker start --attach "$VALIDATOR_ID"
      - name: HACS metadata and archive validation
        run: python3 scripts/check_hacs.py
