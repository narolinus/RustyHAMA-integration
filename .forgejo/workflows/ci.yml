name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install toolchain
        run: pip install -e '.[test]'
      - run: ruff check .
      - run: mypy custom_components/rustyhama
      - run: pytest
      - run: node --test tests/frontend.test.mjs
      - run: python scripts/check_docs.py
      - run: zensical build --clean --strict
      - run: zensical build --config-file zensical.en.toml --clean --strict
      - run: zensical build --config-file zensical.fr.toml --clean --strict

  validate-hacs:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Docker client for validator actions
        run: |
          apt-get update
          apt-get install -y docker.io
      - uses: https://github.com/home-assistant/actions/hassfest@master
      - uses: https://github.com/hacs/action@main
        with:
          category: integration
