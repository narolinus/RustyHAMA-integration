name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: android_build
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: ruff check .
      - run: mypy custom_components/rustyhama
      - run: pytest
      - run: node --test tests/frontend.test.mjs

  validate-hacs:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Docker client for validator actions
        run: |
          apt-get update
          apt-get install -y docker.io
      - name: Hassfest
        run: |
          VALIDATOR_ID="$(docker create ghcr.io/home-assistant/hassfest:latest)"
          trap 'docker rm -f "$VALIDATOR_ID" >/dev/null 2>&1 || true' EXIT
          docker cp . "$VALIDATOR_ID:/github/workspace"
          docker start --attach "$VALIDATOR_ID"
      - name: HACS metadata and archive validation
        run: python3 scripts/check_hacs.py
