name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container: python:3.14
    steps:
      - name: Checkout and install toolchain
        run: |
          apt-get update
          apt-get install -y git nodejs npm
          git init
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          pip install -e '.[test]'
      - run: ruff check .
      - run: mypy custom_components/rustyhama
      - run: pytest
      - run: node --test tests/frontend.test.mjs
      - run: python scripts/check_docs.py
      - run: zensical build --clean --strict
      - run: zensical build --config-file zensical.en.toml --clean --strict
      - run: zensical build --config-file zensical.fr.toml --clean --strict

  validate-hacs:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Docker client for validator actions
        run: |
          apt-get update
          apt-get install -y docker.io
      - uses: https://github.com/home-assistant/actions/hassfest@master
      - uses: https://github.com/hacs/action@main
        with:
          category: integration
