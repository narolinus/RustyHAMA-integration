[project]
site_name = "RustyHAMA Integration"
site_url = "https://daniel.snii.de/RustyHAMA-Integration/"
docs_dir = "docs/de"
site_dir = "site"
nav = [
  {"Start" = "index.md"},
  {"Installation und Pairing" = "installation-pairing.md"},
  {"Konfiguration und Editor" = "configuration-editor.md"},
  {"Entities und Actions" = "entities-actions.md"},
  {"Funktionsmodule" = "modules.md"},
  {"Protokoll und Sicherheit" = "protocol-security.md"},
  {"Betrieb und Fehlersuche" = "operations.md"},
  {"Entwicklung und Releases" = "development-release.md"}
]
[project.extra]
alternate = [
  {name="Deutsch", link="/RustyHAMA-Integration/", lang="de"},
  {name="English", link="/RustyHAMA-Integration/en/", lang="en"},
  {name="Français", link="/RustyHAMA-Integration/fr/", lang="fr"}
]
[project.theme]
language = "de"
features = ["navigation.sections", "navigation.top", "content.code.copy"]
[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.superfences]
